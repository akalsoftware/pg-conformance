name: Release

# Every merge to main publishes. The point is that consumers track this package
# without anyone thinking about it, and a release step people have to remember
# is a release step that gets skipped.
#
# Patch by default. Put [minor] or [major] in the merge commit subject — or
# label the PR release:minor / release:major — when the change is more than a
# fix. [skip release] opts out entirely, for docs-only changes.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip release]') &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgc
          POSTGRES_PASSWORD: pgc
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pgc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      # Publishing something that has not been proven against a real server
      # would defeat the purpose of the package.
      - name: Test before publishing
        env:
          PGURL: postgresql://pgc:pgc@127.0.0.1:5432/postgres
        run: npm test

      # Three ways to ask for more than a patch, in increasing precedence:
      # the merge commit message, the pull request title, a label on the pull
      # request. All three are read, because the first attempt at this read only
      # the first line of the commit message — and a merge commit's first line is
      # "Merge pull request #6 from owner/branch", which put the `[minor]` of the
      # pull request title on line three where nothing looked. It released a
      # patch carrying a breaking change, silently.
      - name: Decide the bump
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          bump=patch
          note="default"

          # The whole message, not just its first line. A squash carries the
          # marker in the subject; a merge commit carries it in the body.
          case "$MESSAGE" in
            *"[major]"*) bump=major; note="[major] in the commit message" ;;
            *"[minor]"*) bump=minor; note="[minor] in the commit message" ;;
          esac

          # The pull request this commit belongs to, resolved by the commit
          # itself rather than by searching for it. `gh pr list --search <sha>`
          # goes through the search index, which had not caught up seconds after
          # a merge, so the labels came back empty and were silently ignored.
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                  --jq '.[0] // empty' 2>/dev/null || true)"

          if [ -n "$pr" ]; then
            title="$(printf '%s' "$pr" | jq -r '.title // ""')"
            case "$title" in
              *"[major]"*) bump=major; note="[major] in the pull request title" ;;
              *"[minor]"*) bump=minor; note="[minor] in the pull request title" ;;
            esac

            # A label wins: it is set deliberately on the pull request, and it
            # survives someone editing a title or a squash subject.
            # `labels` can come back null rather than empty (it did for the
            # Actions token), and `.labels[]` on null stops the step.
            labels="$(printf '%s' "$pr" | jq -r '[(.labels // [])[] | .name? // empty] | join(",")')"
            case ",$labels," in
              *,release:major,*) bump=major; note="release:major label" ;;
              *,release:minor,*) bump=minor; note="release:minor label" ;;
            esac
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Releasing a $bump ($note)"

      - name: Version, tag and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ steps.bump.outputs.bump }}" -m "chore(release): %s [skip release]"
          npm publish
          git push --follow-tags
